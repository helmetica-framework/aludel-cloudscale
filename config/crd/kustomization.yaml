---
# Upstream COSI ships its CRDs with no additionalPrinterColumns at all, so
# `kubectl get buckets` prints only NAME and AGE. Printer columns are a CRD
# field rather than part of the API types, so they can be added locally
# without forking anything — every column below reads a field upstream
# already populates.
#
# This wraps the upstream install so `kubectl apply -k config/crd` gives you
# the CRDs, the controller and the columns in one shot, and re-applying
# upstream never silently reverts them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # COSI serves v1alpha2 only from main, with no release tag, so this pins one
  # upstream commit. The CRDs, the controller and sidecar images and the proto
  # Go module must all come from that same commit: never bump one of them on
  # its own, run `just bump-cosi` instead. `just check-cosi-pins` (part of
  # `just lint`) fails if they drift apart. See "Upgrading COSI" in the README.
  # renovate-cosi: currentValue=main
  - github.com/kubernetes-sigs/container-object-storage-interface?ref=274540c69400dc1e13278b149a4e073339cefde2

# The upstream kustomization pins whatever controller image was current when
# the commit was made, usually one built from an earlier commit. Pin the image
# built from the very same commit instead, so the deployed controller matches
# the CRDs installed beside it.
images:
  - name: gcr.io/k8s-staging-sig-storage/objectstorage-controller
    newTag: v20261019-controllerv0.2.0-rc1-354-g274540c

patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: buckets.objectstorage.k8s.io
    patch: |-
      - op: add
        path: /spec/versions/0/additionalPrinterColumns
        value:
          - name: Ready
            type: boolean
            jsonPath: .status.readyToUse
          - name: Bucket ID
            type: string
            jsonPath: .status.bucketID
          - name: Claim
            type: string
            jsonPath: .spec.bucketClaimRef.name
          - name: Driver
            type: string
            priority: 1
            jsonPath: .spec.driverName
          - name: Error
            type: string
            priority: 1
            jsonPath: .status.error.message
          - name: Age
            type: date
            jsonPath: .metadata.creationTimestamp

  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bucketclaims.objectstorage.k8s.io
    patch: |-
      - op: add
        path: /spec/versions/0/additionalPrinterColumns
        value:
          - name: Ready
            type: boolean
            jsonPath: .status.readyToUse
          - name: Bucket
            type: string
            jsonPath: .status.boundBucketName
          - name: Class
            type: string
            jsonPath: .spec.bucketClassName
          - name: Error
            type: string
            priority: 1
            jsonPath: .status.error.message
          - name: Age
            type: date
            jsonPath: .metadata.creationTimestamp

  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bucketaccesses.objectstorage.k8s.io
    patch: |-
      - op: add
        path: /spec/versions/0/additionalPrinterColumns
        value:
          - name: Ready
            type: boolean
            jsonPath: .status.readyToUse
          - name: Account ID
            type: string
            jsonPath: .status.accountID
          - name: Claim
            type: string
            jsonPath: .spec.bucketClaims[0].bucketClaimName
          - name: Secret
            type: string
            jsonPath: .spec.bucketClaims[0].accessSecretName
          - name: Error
            type: string
            priority: 1
            jsonPath: .status.error.message
          - name: Age
            type: date
            jsonPath: .metadata.creationTimestamp
