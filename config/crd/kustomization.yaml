---
# Upstream COSI ships its CRDs with no additionalPrinterColumns at all, so
# `kubectl get buckets` prints only NAME and AGE. Printer columns are a CRD
# field rather than part of the API types, so they can be added locally
# without forking anything — every column below reads a field upstream
# already populates.
#
# This wraps the upstream install so `kubectl apply -k config/crd` gives you
# the CRDs, the controller and the columns in one shot, and re-applying
# upstream never silently reverts them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# COSI serves v1alpha2 from main and has no tag carrying it, so this pins the revision
# the driver's proto dependency is built against. Bump the two together, and keep the
# sidecar in config/manager/deployment.yaml on the same commit.
  - github.com/kubernetes-sigs/container-object-storage-interface?ref=cc544691e2ef7ddc2fba972d796ed3188ea46315

# The upstream kustomization pins whatever controller image was current when the commit
# was made. Pin the one built from this very commit instead, so the deployed controller
# matches the CRDs installed beside it.
images:
  - name: gcr.io/k8s-staging-sig-storage/objectstorage-controller
    newTag: v20260814-controllerv0.2.0-rc1-320-gcc54469

patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: buckets.objectstorage.k8s.io
    patch: |-
      - op: add
        path: /spec/versions/0/additionalPrinterColumns
        value:
          - name: Ready
            type: boolean
            jsonPath: .status.readyToUse
          - name: Bucket ID
            type: string
            jsonPath: .status.bucketID
          - name: Claim
            type: string
            jsonPath: .spec.bucketClaimRef.name
          - name: Driver
            type: string
            priority: 1
            jsonPath: .spec.driverName
          - name: Age
            type: date
            jsonPath: .metadata.creationTimestamp

  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bucketclaims.objectstorage.k8s.io
    patch: |-
      - op: add
        path: /spec/versions/0/additionalPrinterColumns
        value:
          - name: Ready
            type: boolean
            jsonPath: .status.readyToUse
          - name: Bucket
            type: string
            jsonPath: .status.boundBucketName
          - name: Class
            type: string
            jsonPath: .spec.bucketClassName
          - name: Age
            type: date
            jsonPath: .metadata.creationTimestamp

  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bucketaccesses.objectstorage.k8s.io
    patch: |-
      - op: add
        path: /spec/versions/0/additionalPrinterColumns
        value:
          - name: Ready
            type: boolean
            jsonPath: .status.readyToUse
          - name: Account ID
            type: string
            jsonPath: .status.accountID
          - name: Claim
            type: string
            jsonPath: .spec.bucketClaims[0].bucketClaimName
          - name: Secret
            type: string
            jsonPath: .spec.bucketClaims[0].accessSecretName
          - name: Age
            type: date
            jsonPath: .metadata.creationTimestamp
