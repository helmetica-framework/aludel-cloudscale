apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClass
metadata:
  name: cloudscale-lpg
spec:
  driverName: cloudscale-objectstorage.helmetica.io
  # Retain leaves the bucket and its objects user in place when the BucketClaim
  # goes away. Delete removes both.
  deletionPolicy: Delete
  parameters:
    region: lpg
    # Optional. Defaults to https://objects.<region>.cloudscale.ch
    # endpointURL: https://objects.lpg.cloudscale.ch
    # DeleteIfEmpty (default) refuses to drop a bucket that still holds objects.
    bucketDeletionPolicy: DeleteIfEmpty
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccessClass
metadata:
  name: cloudscale-lpg
spec:
  driverName: cloudscale-objectstorage.helmetica.io
  # Key is the only option; cloudscale.ch has no IAM, so aludel-cloudscale rejects
  # authenticationType: ServiceAccount with an Unimplemented error. v1alpha2 constrains
  # this field with an enum, so a typo is now caught by the API server rather than
  # surfacing later as a driver error.
  authenticationType: Key
  # One bucket per access. The credentials handed back are the bucket owner's, and every
  # bucket has an owner of its own, so there is no key pair that could cover several.
  multiBucketAccess: SingleBucket
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClaim
metadata:
  name: my-test-bucket
  namespace: default
spec:
  bucketClassName: cloudscale-lpg
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: my-test-bucket-access
  namespace: default
spec:
  bucketAccessClassName: cloudscale-lpg
  protocol: S3
  # v1alpha2 takes a list of claims, each naming the secret its credentials land in,
  # where v1alpha1 named one claim and one secret directly on the spec.
  bucketClaims:
    - bucketClaimName: my-test-bucket
      # cloudscale.ch has no bucket policies, so the owner's key pair is the only access
      # there is: anything narrower than ReadWrite is refused rather than over-granted.
      accessMode: ReadWrite
      # COSI writes one value per key here - COSI_S3_ENDPOINT, COSI_S3_ACCESS_KEY_ID and
      # the rest - rather than the single BucketInfo JSON document v1alpha1 wrote.
      accessSecretName: my-test-bucket-credentials
