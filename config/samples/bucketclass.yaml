# A complete aludel-cloudscale example for COSI v1alpha2: one BucketClass and
# BucketAccessClass for the driver, plus a BucketClaim and a BucketAccess that
# use them. The classes are cluster-scoped; the claim and the access live in
# the workload's namespace, and so does the credentials Secret COSI writes.
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClass
metadata:
  name: cloudscale-lpg
spec:
  driverName: cloudscale-objectstorage.helmetica.io
  # Retain leaves the bucket and its objects user in place when the BucketClaim
  # goes away. Delete removes both, subject to bucketDeletionPolicy below.
  deletionPolicy: Delete
  parameters:
    region: lpg
    # Optional. Defaults to https://objects.<region>.cloudscale.ch
    # endpointURL: https://objects.lpg.cloudscale.ch
    # DeleteIfEmpty (default) refuses to drop a bucket that still holds
    # objects: the BucketClaim stays in deletion, with the reason in the
    # Bucket's status.error, until the bucket is emptied. DeleteAll purges
    # every object and version first.
    bucketDeletionPolicy: DeleteIfEmpty
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccessClass
metadata:
  name: cloudscale-lpg
spec:
  driverName: cloudscale-objectstorage.helmetica.io
  # Key is the only option. cloudscale.ch has no IAM, so aludel-cloudscale
  # rejects ServiceAccount with an Unimplemented error.
  authenticationType: Key
  # The credentials handed out are the bucket owner's, and every bucket has an
  # owner of its own, so no key pair could cover several buckets.
  multiBucketAccess: SingleBucket
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClaim
metadata:
  name: my-test-bucket
  namespace: default
spec:
  bucketClassName: cloudscale-lpg
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: my-test-bucket-access
  namespace: default
spec:
  bucketAccessClassName: cloudscale-lpg
  protocol: S3
  bucketClaims:
    - bucketClaimName: my-test-bucket
      # cloudscale.ch has no bucket policies, so access is always the bucket
      # owner's full key pair. Anything narrower than ReadWrite, in any of the
      # three categories, is refused rather than silently over-granted.
      # Categories left unset are fine too.
      accessModes:
        objectData: ReadWrite
        objectMetadata: ReadWrite
        bucketMetadata: ReadWrite
      # COSI writes one key per value here: COSI_S3_BUCKET_ID,
      # COSI_S3_ENDPOINT, COSI_S3_REGION, COSI_S3_ADDRESSING_STYLE,
      # COSI_S3_ACCESS_KEY_ID and COSI_S3_ACCESS_SECRET_KEY.
      accessSecretName: my-test-bucket-credentials
