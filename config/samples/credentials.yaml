# The cloudscale.ch API token the driver authenticates with.
#
# Deliberately not part of any kustomization: applying it with the placeholder below would
# overwrite a real token with an empty one. Fill it in and apply this file on its own, or
# skip it and use the kubectl command underneath.
#
# The token must be **read-write**. cloudscale.ch omits secret_key from objects user
# responses for read-only tokens, and the driver reads that key back on every access grant,
# so a read-only token fails at DriverGrantBucketAccess rather than at startup.
#
# The namespace must be the driver's own: secretKeyRef only resolves within the pod's
# namespace, and this is a cluster-wide credential with full access to every bucket in the
# project, so it stays here and is never exposed to the workloads that claim buckets.
#
#   kubectl -n aludel-cloudscale-system create secret generic aludel-cloudscale-credentials \
#     --from-literal=token="$CLOUDSCALE_API_TOKEN"
#
apiVersion: v1
kind: Secret
metadata:
  name: aludel-cloudscale-credentials
  namespace: aludel-cloudscale-system
type: Opaque
stringData:
  # Paste the read-write API token here. stringData takes it verbatim, so it does not need
  # base64 encoding.
  token: "wv6ro7k26tek7hyk3gwkaqrjmcomyxrc"
